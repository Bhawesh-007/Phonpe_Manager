services:
  mysql:
    image: mysql:8.0
    container_name: phonepe-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: phonepe_manager
    ports:
      - "3306:3306"
    volumes:
      - phonepe-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - phonepe-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phonepe-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/phonepe_manager?useSSL=false&allowPublicKeyRetrieval=true
      ML_SERVICE_URL: http://parser:8000
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      parser:
        condition: service_started
    networks:
      - phonepe-network

  parser:
    build:
      context: ../../Microservice_expense_tracker/expense_parser_service
      dockerfile: Dockerfile
    container_name: phonepe-parser
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - phonepe-network

volumes:
  phonepe-mysql-data:

networks:
  phonepe-network:
    driver: bridge
