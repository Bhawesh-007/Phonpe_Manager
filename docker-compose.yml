services:
  mysql:
    image: mysql:8.0
    container_name: phonepe-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: phonepe_manager
    ports:
      - "3306:3306"
    volumes:
      - phonepe-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - phonepe-network



volumes:
  phonepe-mysql-data:

networks:
  phonepe-network:
    driver: bridge
