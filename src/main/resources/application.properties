spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/phonepe_manager

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
app.cors.allowed-origins=http://localhost:8000,http://127.0.0.1:8000,http://localhost:5173,http://localhost:5174
security.jwt.secret-key=${JWT_SECRET_KEY}
logging.level.org.springframework.security=DEBUG

ml.service.url=${ML_SERVICE_URL:http://localhost:8000}